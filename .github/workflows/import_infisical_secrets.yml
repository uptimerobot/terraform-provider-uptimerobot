name: Temporary - copy GitHub secrets to Infisical

on:
  push:
    branches:
      - chore/bac-370-infisical-import

permissions:
  contents: read

env:
  MIGRATION_MODE: dry-run
  SYNCS_CONFIRMED_DISABLED: 'false'

concurrency:
  group: infisical-import
  cancel-in-progress: false

jobs:
  validate-importer:
    if: github.event_name == 'push' && github.ref == 'refs/heads/chore/bac-370-infisical-import'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the importer with dummy values
        run: python3 -B -m unittest discover -s scripts -p test_import_infisical_secrets.py

  import-repo:
    needs: validate-importer
    if: github.event_name == 'push' && github.ref == 'refs/heads/chore/bac-370-infisical-import'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Copy or verify secrets
        shell: bash
        env:
          MIGRATION_SCOPE: repo
          INFISICAL_MIGRATION_TOKEN: ${{ secrets.INFISICAL_MIGRATION_TOKEN }}
          SOURCE_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          SOURCE_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          SOURCE_UPTIMEROBOT_API_KEY: ${{ secrets.UPTIMEROBOT_API_KEY }}
        run: python3 -B scripts/import-infisical-secrets.py
